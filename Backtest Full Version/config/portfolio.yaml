# Portfolio Configuration
portfolio_name: "Default Balanced Wealth Portfolio"
base_currency: "USD" # Currency reference: USD ($)

# Asset Allocation Mapping
assets:
  CSPX:
    type: "equity_etf"
    allocation: 0.45
    ticker: "CSPX.L"
    description: "iShares Core S&P 500 UCITS ETF (Acc)"

  BTC:
    type: "crypto"
    allocation: 0.25
    ticker: "BTC-USD"
    description: "Bitcoin / USD Spot"

  BANK:
    type: "equity"
    allocation: 0.25
    ticker: "BBCA.JK"
    description: "PT Bank Central Asia Tbk (BBCA)"

  GOLD:
    type: "commodity_or_gold_proxy"
    allocation: 0.05
    ticker: "GLD"
    description: "SPDR Gold Shares"

# Market Data Settings
market_data:
  default_provider: "yfinance"
  frequency: "daily"
  start_date: "2016-01-01"
  end_date: "today"
  calendar_alignment: "forward_fill"
  outlier_std_threshold: 4.0

# Backtest Simulation Settings (Denominated in USD)
backtest:
  initial_capital: 10000.0            # $10,000 initial capital
  monthly_contribution: 500.0         # $500 per month
  contribution_growth_rate: 0.10      # 10% annual contribution increase
  rebalance_frequency: "quarterly"    # monthly, quarterly, semi_annual, annual, threshold, none
  rebalance_threshold: 0.05           # 5% max deviation
  transaction_cost_pct: 0.001         # 0.10% (10 bps) fee & slippage
  annual_inflation_rate: 0.03         # 3.0% annual inflation assumption
